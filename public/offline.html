<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PropNoxa — Offline</title>
    <meta name="theme-color" content="#102a43" />
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
        background: #f4f6fb;
        color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        background: #fff;
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 16px;
        padding: 28px 32px;
        max-width: 420px;
        margin: 16px;
        text-align: center;
        box-shadow: 0 18px 40px rgba(16, 24, 40, 0.08);
      }
      img { width: 64px; height: 64px; border-radius: 14px; margin-bottom: 12px; }
      h1 { font-size: 20px; margin: 0 0 6px; letter-spacing: -0.02em; }
      p { margin: 0 0 18px; font-size: 14px; line-height: 1.5; color: #334155; }
      button {
        font: inherit;
        background: #2563eb;
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 10px 18px;
        cursor: pointer;
      }
      button:hover { background: #1d4ed8; }
      @media (prefers-color-scheme: dark) {
        body { background: #0b1220; color: #e2e8f0; }
        .card { background: #131c2e; border-color: rgba(148, 163, 184, 0.16); }
        p { color: #cbd5e1; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="" />
      <h1 id="offline-title">You're offline</h1>
      <p id="offline-body">
        PropNoxa needs a connection for live property data. Check your network and try
        again — recently visited pages still work offline.
      </p>
      <button id="offline-retry" onclick="location.reload()">Try again</button>
    </div>
    <script>
      // Mirror the in-app language preference where possible (Kiswahili first
      // when the browser prefers it); the offline page has no i18n bundle.
      ;(function () {
        if ((navigator.language || '').toLowerCase().indexOf('sw') === 0) {
          document.documentElement.lang = 'sw'
          document.getElementById('offline-title').textContent = 'Huna mtandao'
          document.getElementById('offline-body').textContent =
            'PropNoxa inahitaji muunganisho kwa taarifa za moja kwa moja. Angalia mtandao wako na ujaribu tena — kurasa ulizotembelea hivi karibuni zinaweza kufanya kazi bila mtandao.'
          document.getElementById('offline-retry').textContent = 'Jaribu tena'
        }
      })()
    </script>
  </body>
</html>
