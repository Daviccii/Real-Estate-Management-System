name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — typecheck, unit tests, build, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      - name: Install Playwright browser
        run: npm run test:e2e:install

      # Playwright config starts the Vite dev server itself (webServer block).
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

  backend-sources:
    name: Check backend sources are tracked
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        run: |
          if [ -f backend/requirements.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Backend CI skipped::backend/ is a gitlink placeholder in this repo (nested .git, no .gitmodules), so backend sources are not in the checkout. Run scripts/consolidate-backend-git.sh locally, commit, and push to enable backend CI."
          fi

  backend:
    name: Backend — pytest, bandit, pip-audit
    needs: backend-sources
    if: needs.backend-sources.outputs.present == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # The suite runs against the in-memory SQLite database wired up in
      # tests/conftest.py; these two values only satisfy required Settings
      # fields at import time (never used by tests, never a real secret).
      DATABASE_URL: sqlite:///./ci-test.db
      SECRET_KEY: ci-only-placeholder-not-a-real-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest tests -q

      - name: Static security analysis (bandit, medium+)
        run: |
          pip install -q bandit
          bandit -r app -ll -q

      # Advisory for now: requirements.txt pins minimum versions, so newly
      # disclosed CVEs turn this red even when the app is not affected.
      # Review findings, pin a fixed version, then this can become blocking.
      - name: Dependency audit (pip-audit, advisory)
        run: |
          pip install -q pip-audit
          pip-audit -r requirements.txt
        continue-on-error: true

  frontend-audit:
    name: Frontend — dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Blocking gate: production dependencies only. Dev-only advisories in
      # the vitest/esbuild toolchain (tinypool, @vitest/mocker) currently
      # require breaking major upgrades and are tracked as advisory below.
      - name: Production dependencies — high+ (blocking)
        run: npm audit --omit=dev --audit-level=high

      - name: All dependencies — moderate+ (advisory)
        run: npm audit --audit-level=moderate
        continue-on-error: true

  docker:
    name: Backend image build
    needs: backend-sources
    if: needs.backend-sources.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t real-estate-api:ci ./backend
